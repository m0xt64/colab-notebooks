<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Calendar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background:
        radial-gradient(ellipse 130% 52% at 50% 34%, rgba(196,138,82,0.72) 0%, rgba(212,162,108,0.28) 45%, transparent 65%),
        linear-gradient(180deg, #F0EDE8 0%, #EAE0D2 38%, #DDD0BC 100%);
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
    }

    .screen {
      padding: max(52px, calc(16px + env(safe-area-inset-top))) 20px max(40px, env(safe-area-inset-bottom));
    }

    /* ── HEADER ── */
    .header {
      margin-bottom: 22px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #C8AE96, #A8907A);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .avatar svg {
      width: 26px;
      height: 26px;
      fill: rgba(255,255,255,0.82);
    }

    /* ── TITLE ── */
    .title {
      font-size: 40px;
      font-weight: 500;
      letter-spacing: -1.5px;
      line-height: 1.04;
      margin-bottom: 22px;
      color: #1A1612;
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .month-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 400;
      color: #1A1612;
      white-space: nowrap;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }

    .mnav {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 17px;
      color: rgba(26,22,18,0.45);
      padding: 0 1px;
      line-height: 1;
    }

    .mnav:active { color: rgba(26,22,18,0.8); }

    .cal-icon { font-size: 13px; opacity: 0.6; }

    /* filter pill */
    .filter-pill {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50px;
      padding: 5px;
      flex: 1;
      gap: 2px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .ftab {
      flex: 1;
      padding: 6px 6px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 400;
      cursor: pointer;
      text-align: center;
      color: rgba(26,22,18,0.5);
      white-space: nowrap;
      transition: all 0.18s;
      user-select: none;
    }

    .ftab.on {
      background: #252018;
      color: #fff;
    }

    .fbadge {
      min-width: 20px;
      height: 20px;
      border-radius: 50px;
      padding: 0 5px;
      background: #252018;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── WEEKDAY HEADERS ── */
    .wdhdr {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 5px;
    }

    .wd {
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      color: rgba(26,22,18,0.42);
      padding: 3px 0;
    }

    /* ── CALENDAR GRID ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day {
      aspect-ratio: 1;
      border-radius: 9px;
      background: rgba(255,252,248,0.88);
      border: 1px solid rgba(215,198,180,0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.12s;
    }

    .day:active { transform: scale(0.88); }

    .day.empty {
      background: rgba(255,252,248,0.28);
      border-color: transparent;
      cursor: default;
      pointer-events: none;
    }

    .day-num {
      font-size: 13px;
      font-weight: 500;
      color: #2A2318;
      line-height: 1;
      transition: opacity 0.18s;
    }

    /* ── SILOVÝ: dark fill ── */
    .day.v-silovy {
      background: #252018;
      border-color: transparent;
    }
    .day.v-silovy .day-num { color: #fff; font-weight: 600; }

    /* ── PILATES: diagonal hatching ── */
    .day.v-pilates:not(.v-silovy) {
      background:
        repeating-linear-gradient(
          45deg,
          rgba(0,0,0,0.065) 0px,
          rgba(0,0,0,0.065) 1.5px,
          rgba(254,252,249,0.92) 1.5px,
          rgba(254,252,249,0.92) 6px
        );
    }

    /* ── DIASTÁZA: dot below number ── */
    .diastaza-dot {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1A1612;
    }

    .day.v-silovy .diastaza-dot { background: rgba(255,255,255,0.72); }

    /* ── TODAY ── */
    .day.is-today { box-shadow: inset 0 0 0 1.5px rgba(26,22,18,0.5); }

    /* ── DIMMED (filtered out) ── */
    .day.dimmed .day-num { opacity: 0.22; }
    .day.dimmed { background: rgba(255,252,248,0.42); }

    /* ── BOTTOM SHEET ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(18,14,10,0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      background: #FDFAF7;
      border-radius: 28px 28px 0 0;
      padding: 12px 22px max(48px, calc(22px + env(safe-area-inset-bottom)));
      width: 100%;
      max-width: 430px;
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 36px;
      height: 4px;
      background: #E2DCD4;
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-date {
      font-size: 21px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 18px;
      letter-spacing: -0.4px;
      color: #1A1612;
    }

    /* activity rows */
    .act-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px;
      border-radius: 14px;
      background: #F2EDE7;
      margin-bottom: 9px;
      cursor: pointer;
      transition: background 0.14s;
      user-select: none;
    }

    .act-row:active { background: #E8E0D6; }

    .act-left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .act-swatch {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      flex-shrink: 0;
    }

    /* swatch visuals match calendar cells */
    .sw-silovy { background: #252018; }

    .sw-pilates {
      background:
        repeating-linear-gradient(
          45deg,
          rgba(0,0,0,0.08) 0px,
          rgba(0,0,0,0.08) 1.5px,
          #F2EDE7 1.5px,
          #F2EDE7 6px
        );
      border: 1px solid rgba(0,0,0,0.1);
    }

    .sw-diastaza {
      background: #F2EDE7;
      border: 1px solid rgba(0,0,0,0.1);
      position: relative;
    }

    .sw-diastaza::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1A1612;
    }

    .act-name {
      font-size: 15.5px;
      font-weight: 600;
      color: #1A1612;
    }

    .act-check {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 2px solid #CCC5BB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: transparent;
      transition: all 0.18s;
      flex-shrink: 0;
    }

    .act-row.on .act-check {
      background: #1A1612;
      border-color: #1A1612;
      color: #fff;
    }

    .save-btn {
      width: 100%;
      padding: 16px;
      background: #1A1612;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      letter-spacing: 0.1px;
      transition: opacity 0.15s;
    }

    .save-btn:active { opacity: 0.82; }
  </style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <header class="header">
    <div class="avatar">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </div>
  </header>

  <!-- Title -->
  <h1 class="title">Workout</h1>

  <!-- Controls -->
  <div class="controls">
    <div class="month-pill">
      <button class="mnav" onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel"></span>
      <button class="mnav" onclick="changeMonth(1)">›</button>
    </div>
    <div class="filter-pill">
      <div class="ftab on" data-f="all"      onclick="setFilter('all')">Vše</div>
<div class="ftab"   data-f="pilates"   onclick="setFilter('pilates')">Pilates</div>
      <div class="ftab"   data-f="diastaza"  onclick="setFilter('diastaza')">Diastáza</div>
      <div class="ftab"   data-f="silovy"    onclick="setFilter('silovy')">Silový</div>
    </div>
  </div>

  <!-- Weekdays -->
  <div class="wdhdr">
    <div class="wd">Po</div><div class="wd">Út</div><div class="wd">St</div>
    <div class="wd">Čt</div><div class="wd">Pá</div><div class="wd">So</div>
    <div class="wd">Ne</div>
  </div>

  <!-- Calendar -->
  <div class="cal-grid" id="calGrid"></div>

</div>

<!-- Bottom sheet -->
<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-date" id="sheetDate"></div>

    <div class="act-row" id="row-silovy" onclick="toggle('silovy')">
      <div class="act-left">
        <div class="act-swatch sw-silovy"></div>
        <span class="act-name">Silový trénink</span>
      </div>
      <div class="act-check">✓</div>
    </div>

    <div class="act-row" id="row-pilates" onclick="toggle('pilates')">
      <div class="act-left">
        <div class="act-swatch sw-pilates"></div>
        <span class="act-name">Pilates</span>
      </div>
      <div class="act-check">✓</div>
    </div>

    <div class="act-row" id="row-diastaza" onclick="toggle('diastaza')">
      <div class="act-left">
        <div class="act-swatch sw-diastaza"></div>
        <span class="act-name">Diastáza</span>
      </div>
      <div class="act-check">✓</div>
    </div>

    <button class="save-btn" onclick="save()">Uložit</button>
  </div>
</div>

<script>
  const MONTHS = ['Leden','Únor','Březen','Duben','Květen','Červen',
                  'Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  const MONTHS_GEN = ['ledna','února','března','dubna','května','června',
                      'července','srpna','září','října','listopadu','prosince'];

  let yr = new Date().getFullYear();
  let mo = new Date().getMonth();
  let db = JSON.parse(localStorage.getItem('myCal') || '{}');
  let filt = 'all';
  let selDate = null;
  let ms = { silovy: false, pilates: false, diastaza: false };

  function fmt(y,m,d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function changeMonth(d) {
    mo += d;
    if (mo > 11) { mo = 0; yr++; }
    if (mo < 0)  { mo = 11; yr--; }
    render();
  }

  function setFilter(f) {
    filt = f;
    document.querySelectorAll('.ftab').forEach(el =>
      el.classList.toggle('on', el.dataset.f === f));
    render();
  }

  function render() {
    document.getElementById('monthLabel').textContent = MONTHS[mo];

    const now = new Date();
    const prefix = `${yr}-${String(mo+1).padStart(2,'0')}`;
    let count = 0;
    Object.entries(db).forEach(([k,v]) => {
      if (!k.startsWith(prefix)) return;
      if (filt === 'all' ? (v.silovy||v.pilates||v.diastaza) : v[filt]) count++;
    });

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const offset  = (new Date(yr, mo, 1).getDay() + 6) % 7;
    const numDays = new Date(yr, mo + 1, 0).getDate();

    for (let i = 0; i < offset; i++) {
      const e = document.createElement('div');
      e.className = 'day empty';
      grid.appendChild(e);
    }

    for (let d = 1; d <= numDays; d++) {
      const k = fmt(yr, mo, d);
      const e = db[k] || {};
      const isToday = now.getFullYear()===yr && now.getMonth()===mo && now.getDate()===d;

      const cell = document.createElement('div');
      const classes = ['day'];
      if (isToday) classes.push('is-today');

      const hasActivity = e.silovy || e.pilates || e.diastaza;
      const matchesFilter = filt === 'all' ? hasActivity : e[filt];

      // Visual state (silovy dominates for background)
      if (e.silovy && (filt === 'all' || filt === 'silovy')) classes.push('v-silovy');
      else if (e.pilates && (filt === 'all' || filt === 'pilates')) classes.push('v-pilates');

      // Dim if filtered and doesn't match
      if (filt !== 'all' && !e[filt]) classes.push('dimmed');

      cell.className = classes.join(' ');
      cell.onclick = () => openSheet(k, d);

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      cell.appendChild(num);

      // Diastaza dot
      if (e.diastaza && (filt === 'all' || filt === 'diastaza')) {
        const dot = document.createElement('div');
        dot.className = 'diastaza-dot';
        cell.appendChild(dot);
      }

      grid.appendChild(cell);
    }
  }

  function openSheet(k, d) {
    selDate = k;
    const e = db[k] || {};
    ms = { silovy: !!e.silovy, pilates: !!e.pilates, diastaza: !!e.diastaza };
    document.getElementById('sheetDate').textContent =
      `${d}. ${MONTHS_GEN[mo]} ${yr}`;
    syncSheet();
    document.getElementById('overlay').classList.add('open');
  }

  function syncSheet() {
    ['silovy','pilates','diastaza'].forEach(a =>
      document.getElementById(`row-${a}`).classList.toggle('on', ms[a]));
  }

  function toggle(a) { ms[a] = !ms[a]; syncSheet(); }

  function onOverlayClick(e) {
    if (e.target === document.getElementById('overlay'))
      document.getElementById('overlay').classList.remove('open');
  }

  function save() {
    if (ms.silovy || ms.pilates || ms.diastaza) {
      db[selDate] = { ...ms };
    } else {
      delete db[selDate];
    }
    localStorage.setItem('myCal', JSON.stringify(db));
    document.getElementById('overlay').classList.remove('open');
    render();
  }

  render();
</script>
</body>
</html>
