<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trénink</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:      #E8DDD1;
      --dark:    #1A1612;
      --card:    #FFFFFF;
      --border:  #DDD3C6;
      --text:    #1A1612;
      --muted:   #9A9088;
      --r:       22px;
      --r-sm:    14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 max(48px, env(safe-area-inset-bottom));
      max-width: 430px;
      margin: 0 auto;
    }

    /* ──────────── HEADER ──────────── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: max(52px, calc(16px + env(safe-area-inset-top))) 20px 20px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .header-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--dark);
      padding: 8px 12px;
      border-radius: 50px;
      margin-top: 4px;
    }

    .month-nav button {
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .month-nav button:active { color: #fff; }

    .month-label {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      min-width: 76px;
      text-align: center;
    }

    /* ──────────── HERO DARK CARD ──────────── */
    .hero {
      background: var(--dark);
      border-radius: var(--r);
      padding: 22px 22px 20px;
      margin: 0 16px 14px;
      color: #fff;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .streak-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }

    .streak-val {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .streak-flame { font-size: 26px; line-height: 1; }

    .streak-num {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }

    .streak-unit {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
      align-self: flex-end;
      padding-bottom: 4px;
    }

    .pct-block { text-align: right; }

    .pct-num {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }

    .pct-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
      text-align: right;
    }

    .pct-frac {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 3px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: rgba(255,255,255,0.8);
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quote-text {
      font-size: 13px;
      font-style: italic;
      color: rgba(255,255,255,0.45);
      line-height: 1.55;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    /* ──────────── WEEK STRIP ──────────── */
    .week-card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--r);
      padding: 18px 16px;
      margin: 0 16px 14px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
    }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .wday {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .wday-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
    }

    .wday-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border: 2px solid transparent;
      position: relative;
      transition: all 0.2s;
    }

    .wday-circle.has-w  { font-weight: 700; }
    .wday-circle.today  { border-color: var(--dark); color: var(--dark); }
    .wday-circle.done   { background: var(--dark) !important; color: #fff !important; border-color: transparent !important; }

    /* ──────────── CALENDAR ──────────── */
    .cal-card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--r);
      padding: 20px 14px 16px;
      margin: 0 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
    }

    .wdhdr-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 6px;
    }

    .wdhdr {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 0;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day {
      border-radius: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 5px 2px 7px;
      min-height: 54px;
      transition: transform 0.12s;
      position: relative;
    }

    .day:active { transform: scale(0.88); }
    .day.empty  { cursor: default; pointer-events: none; }

    .day-num {
      font-size: 13px;
      font-weight: 500;
      width: 27px;
      height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 4px;
    }

    .day.today .day-num {
      background: var(--dark);
      color: #fff;
      font-weight: 700;
    }

    .day-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    /* Done: entire cell fills with workout color */
    .day.is-done {
      border-radius: 13px;
    }

    .day.is-done .day-num {
      font-weight: 700;
    }

    /* ──────────── WORKOUT COLORS ──────────── */
    .c-pilates  { background: #E8D5CC; }
    .c-silovy   { background: #F2E0C2; }
    .c-diastaza { background: #D8D2CA; }
    .c-ostatni  { background: #DDD8D0; }

    .t-pilates  { color: #8C5A50; }
    .t-silovy   { color: #B87430; }
    .t-diastaza { color: #6A6058; }
    .t-ostatni  { color: #5A5248; }

    /* ──────────── LEGEND ──────────── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    .leg-dot { width: 8px; height: 8px; border-radius: 3px; }

    /* ──────────── BOTTOM SHEET ──────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 14, 10, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      background: var(--card);
      border-radius: 28px 28px 0 0;
      padding: 12px 20px max(48px, calc(20px + env(safe-area-inset-bottom)));
      width: 100%;
      max-width: 430px;
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 38px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-date {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 22px;
      letter-spacing: -0.5px;
    }

    .wo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .wo-btn {
      padding: 15px 12px;
      border-radius: var(--r-sm);
      border: 2.5px solid transparent;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.14s;
      user-select: none;
    }

    .wo-btn:active { transform: scale(0.94); }
    .wo-btn.sel    { border-color: currentColor; }

    .wo-none {
      grid-column: span 2;
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
      padding: 12px;
    }

    .wo-none.sel { border-color: var(--border); }

    .done-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-radius: var(--r-sm);
      padding: 15px 16px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .done-row.disabled { opacity: 0.32; pointer-events: none; }
    .done-row-label    { font-size: 15px; font-weight: 600; }

    .toggle-track {
      width: 50px;
      height: 28px;
      background: var(--border);
      border-radius: 14px;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle-track.on { background: #3D9970; }

    .toggle-thumb {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 1px 5px rgba(0,0,0,0.22);
    }

    .toggle-track.on .toggle-thumb { transform: translateX(22px); }

    .save-btn {
      width: 100%;
      padding: 17px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.1px;
      transition: opacity 0.15s;
    }

    .save-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div>
      <h1>Trénink</h1>
      <div class="header-sub" id="headerSub"></div>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </header>

  <!-- Hero dark card -->
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="streak-tag">Série</div>
        <div class="streak-val">
          <span class="streak-flame">🔥</span>
          <span class="streak-num" id="streakNum">0</span>
          <span class="streak-unit">dní</span>
        </div>
      </div>
      <div class="pct-block">
        <div class="pct-tag">Splněno</div>
        <div class="pct-num" id="heroPct">—</div>
        <div class="pct-frac" id="heroFrac">0 / 0 tréninků</div>
      </div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="quote-text" id="quoteEl"></div>
  </div>

  <!-- Week strip -->
  <div class="week-card">
    <div class="card-label">Tento týden</div>
    <div class="week-row" id="weekRow"></div>
  </div>

  <!-- Calendar -->
  <div class="cal-card">
    <div class="wdhdr-row">
      <div class="wdhdr">Po</div><div class="wdhdr">Út</div>
      <div class="wdhdr">St</div><div class="wdhdr">Čt</div>
      <div class="wdhdr">Pá</div><div class="wdhdr">So</div>
      <div class="wdhdr">Ne</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <div class="leg"><div class="leg-dot c-pilates"></div>Pilátes</div>
      <div class="leg"><div class="leg-dot c-silovy"></div>Silový</div>
      <div class="leg"><div class="leg-dot c-diastaza"></div>Diastáza</div>
      <div class="leg"><div class="leg-dot c-ostatni"></div>Ostatní</div>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div class="overlay" id="overlay" onclick="onOverlayClick(event)">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-date" id="sheetDate"></div>
      <div class="wo-grid">
        <div class="wo-btn c-pilates t-pilates"   data-w="pilates"  onclick="pick('pilates')">Pilátes</div>
        <div class="wo-btn c-silovy t-silovy"     data-w="silovy"   onclick="pick('silovy')">Silový trénink</div>
        <div class="wo-btn c-diastaza t-diastaza" data-w="diastaza" onclick="pick('diastaza')">Diastáza</div>
        <div class="wo-btn c-ostatni t-ostatni"   data-w="ostatni"  onclick="pick('ostatni')">Ostatní</div>
        <div class="wo-btn wo-none"               data-w=""         onclick="pick('')">Žádný trénink</div>
      </div>
      <div class="done-row disabled" id="doneRow" onclick="toggleDone()">
        <span class="done-row-label">Označit jako splněno ✓</span>
        <div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div>
      </div>
      <button class="save-btn" onclick="save()">Uložit</button>
    </div>
  </div>

  <script>
    const MONTHS     = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
    const MONTHS_GEN = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
    const DAYS_CS    = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
    const WD         = ['Po','Út','St','Čt','Pá','So','Ne'];

    const QUOTES = [
      'Každý krok vpřed je vítězství nad sebou samou.',
      'Tvoje tělo umí více, než si myslíš.',
      'Nejlepší cvičení je to, které jsi opravdu udělala.',
      'Pohyb je ta nejlepší péče o sebe.',
      'Silná žena začíná tím, že uvěří sama sobě.',
      'Každý den je nová šance začít znovu.',
      'Tvoje odhodlání je silnější než tvoje výmluvy.',
      'Malé kroky vedou k velkým změnám.',
      'Pohni se – budeš se cítit lépe, vždy.',
      'Dnes jsi o krok blíž ke své nejlepší verzi.',
      'Cvičení není trest. Je to dar svému tělu.',
      'Nezáleží na rychlosti, záleží na tom, že se pohybuješ.',
      'Síla přichází z překonávání sebe sama, ne ostatních.',
      'Tvoje tělo tě poslouchá. Řekni mu, ať je silné.',
      'Pohyb vytváří energii, energie vytváří pohyb.',
      'Nedělej to pro ostatní. Dělej to pro sebe.',
      'Každé cvičení tě posouvá dál, i když to tak nevypadá.',
      'Zítra budeš ráda, že jsi to dnes udělala.',
      'Buď hrdá na každý centimetr své cesty.',
      'Tvoje série pokračuje – protože ty to nevzdáváš.',
    ];

    const W_COLORS = {
      pilates:  { bg: '#E8D5CC', fg: '#8C5A50' },
      silovy:   { bg: '#F2E0C2', fg: '#B87430' },
      diastaza: { bg: '#D8D2CA', fg: '#6A6058' },
      ostatni:  { bg: '#DDD8D0', fg: '#5A5248' },
    };

    let year = new Date().getFullYear();
    let month = new Date().getMonth();
    let db = JSON.parse(localStorage.getItem('wt') || '{}');
    let selDate = null, mWorkout = '', mDone = false;

    function fmt(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function dayOfYear(date) {
      return Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    }

    function calcStreak() {
      const now = new Date();
      let d = new Date(now);
      const todayKey = fmt(d.getFullYear(), d.getMonth(), d.getDate());
      if (!db[todayKey]?.done) d.setDate(d.getDate() - 1);
      let s = 0;
      for (let i = 0; i < 366; i++) {
        const k = fmt(d.getFullYear(), d.getMonth(), d.getDate());
        if (db[k]?.done) { s++; d.setDate(d.getDate() - 1); }
        else break;
      }
      return s;
    }

    function changeMonth(delta) {
      month += delta;
      if (month > 11) { month = 0; year++; }
      if (month < 0)  { month = 11; year--; }
      render();
    }

    function render() {
      const now = new Date();

      // Header
      document.getElementById('headerSub').textContent =
        `${DAYS_CS[now.getDay()]}, ${now.getDate()}. ${MONTHS_GEN[now.getMonth()]}`;
      document.getElementById('monthLabel').textContent = MONTHS[month];

      // Quote (rotates daily)
      document.getElementById('quoteEl').textContent =
        `„${QUOTES[dayOfYear(now) % QUOTES.length]}"`;

      // Stats
      const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      let planned = 0, done = 0;
      Object.entries(db).forEach(([k, v]) => {
        if (k.startsWith(prefix) && v?.workout) { planned++; if (v.done) done++; }
      });
      const pct = planned ? Math.round(done / planned * 100) : null;

      document.getElementById('streakNum').textContent = calcStreak();
      document.getElementById('heroPct').textContent = pct !== null ? `${pct}%` : '—';
      document.getElementById('heroFrac').textContent = `${done} / ${planned} tréninků`;
      document.getElementById('progressFill').style.width = (pct || 0) + '%';

      // Calendar
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      const offset  = (new Date(year, month, 1).getDay() + 6) % 7;
      const numDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < offset; i++) {
        const e = document.createElement('div');
        e.className = 'day empty';
        grid.appendChild(e);
      }

      for (let d = 1; d <= numDays; d++) {
        const k = fmt(year, month, d);
        const entry   = db[k];
        const isToday = now.getFullYear() === year && now.getMonth() === month && now.getDate() === d;

        const cell = document.createElement('div');
        cell.className = 'day' + (isToday ? ' today' : '');
        cell.onclick = () => openSheet(k, d);

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = d;
        cell.appendChild(num);

        if (entry?.workout) {
          const c = W_COLORS[entry.workout];
          if (entry.done) {
            cell.style.background = c.bg;
            cell.classList.add('is-done');
            num.style.color = c.fg;
          } else {
            const dot = document.createElement('div');
            dot.className = `day-dot c-${entry.workout}`;
            cell.appendChild(dot);
          }
        }

        grid.appendChild(cell);
      }

      // Week strip
      const dow    = (now.getDay() + 6) % 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() - dow);

      const weekRow = document.getElementById('weekRow');
      weekRow.innerHTML = '';

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const k       = fmt(d.getFullYear(), d.getMonth(), d.getDate());
        const entry   = db[k];
        const isToday = d.toDateString() === now.toDateString();

        const col = document.createElement('div');
        col.className = 'wday';

        const lbl = document.createElement('div');
        lbl.className = 'wday-label';
        lbl.textContent = WD[i];
        col.appendChild(lbl);

        const circle = document.createElement('div');
        circle.className = 'wday-circle';
        circle.textContent = d.getDate();

        if (entry?.done) {
          circle.classList.add('done');
          circle.textContent = '✓';
        } else if (entry?.workout) {
          const c = W_COLORS[entry.workout];
          circle.classList.add('has-w');
          circle.style.background = c.bg;
          circle.style.color = c.fg;
        }

        if (isToday) circle.classList.add('today');
        col.appendChild(circle);
        weekRow.appendChild(col);
      }
    }

    function openSheet(k, d) {
      selDate  = k;
      const e  = db[k] || {};
      mWorkout = e.workout || '';
      mDone    = e.done    || false;

      document.getElementById('sheetDate').textContent =
        `${d}. ${MONTHS_GEN[month]} ${year}`;
      document.querySelectorAll('.wo-btn').forEach(el => {
        el.classList.toggle('sel', el.dataset.w === mWorkout);
      });
      updateToggle();
      document.getElementById('overlay').classList.add('open');
    }

    function onOverlayClick(e) {
      if (e.target === document.getElementById('overlay'))
        document.getElementById('overlay').classList.remove('open');
    }

    function pick(w) {
      mWorkout = w;
      document.querySelectorAll('.wo-btn').forEach(el => {
        el.classList.toggle('sel', el.dataset.w === w);
      });
      if (!w) mDone = false;
      updateToggle();
    }

    function toggleDone() {
      mDone = !mDone;
      updateToggle();
    }

    function updateToggle() {
      document.getElementById('doneRow').classList.toggle('disabled', !mWorkout);
      document.getElementById('toggleTrack').classList.toggle('on', mDone && !!mWorkout);
    }

    function save() {
      if (mWorkout) {
        db[selDate] = { workout: mWorkout, done: mDone };
      } else {
        delete db[selDate];
      }
      localStorage.setItem('wt', JSON.stringify(db));
      document.getElementById('overlay').classList.remove('open');
      render();
    }

    render();
  </script>
</body>
</html>
