<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tréninkový plán</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #F2F0EC;
      --card: #FFFFFF;
      --text: #1C1C28;
      --text-muted: #9094A0;
      --border: #E8E6E1;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
      --r: 18px;
      --r-sm: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      padding: 6px 10px;
      border-radius: 50px;
      box-shadow: var(--shadow);
    }

    .month-nav button {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text);
      transition: background 0.15s;
    }

    .month-nav button:active { background: var(--bg); }

    .month-label {
      font-size: 14px;
      font-weight: 600;
      min-width: 110px;
      text-align: center;
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      border-radius: var(--r);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-num {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Calendar card ── */
    .card {
      background: var(--card);
      border-radius: var(--r);
      padding: 18px 14px 16px;
      box-shadow: var(--shadow);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 6px;
    }

    .wd {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 0;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day {
      border-radius: var(--r-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 5px 2px 6px;
      min-height: 52px;
      transition: transform 0.12s;
      position: relative;
    }

    .day:active { transform: scale(0.9); }
    .day.empty { cursor: default; pointer-events: none; }

    .day-num {
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 5px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .day.today .day-num {
      background: var(--text);
      color: #fff;
      font-weight: 700;
    }

    .day-badge {
      width: 28px;
      height: 7px;
      border-radius: 4px;
      transition: opacity 0.15s;
    }

    .done-check {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      background: #22C55E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: white;
      font-weight: 800;
    }

    /* ── Workout colors ── */
    .c-pilates  { background: #EDD9FF; }
    .c-silovy   { background: #FFE0C2; }
    .c-volejbal { background: #C2E5FF; }
    .c-kolo     { background: #C8F7DC; }
    .c-diastaza { background: #FFC8D9; }

    .t-pilates  { color: #7C3ABE; }
    .t-silovy   { color: #C2610A; }
    .t-volejbal { color: #0A72A8; }
    .t-kolo     { color: #0F8040; }
    .t-diastaza { color: #C2184A; }

    /* ── Legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .leg-dot {
      width: 9px;
      height: 9px;
      border-radius: 3px;
    }

    /* ── Bottom sheet modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20,20,30,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .sheet {
      background: var(--card);
      border-radius: 26px 26px 0 0;
      padding: 12px 20px 44px;
      width: 100%;
      max-width: 430px;
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .overlay.open .sheet { transform: translateY(0); }

    .handle {
      width: 38px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .sheet-date {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: -0.3px;
    }

    .workout-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .wo-btn {
      padding: 13px 10px;
      border-radius: var(--r-sm);
      border: 2.5px solid transparent;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.14s;
      user-select: none;
    }

    .wo-btn:active { transform: scale(0.95); }

    .wo-btn.sel { border-color: currentColor; box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }

    .wo-none {
      grid-column: span 2;
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      padding: 11px;
    }

    .wo-none.sel { border-color: var(--border); }

    /* ── Done toggle ── */
    .done-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-radius: var(--r-sm);
      padding: 14px 16px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .done-row.disabled { opacity: 0.38; pointer-events: none; }

    .done-row-label { font-size: 15px; font-weight: 600; }

    .toggle-track {
      width: 50px;
      height: 28px;
      background: var(--border);
      border-radius: 14px;
      position: relative;
      transition: background 0.2s;
    }

    .toggle-track.on { background: #22C55E; }

    .toggle-thumb {
      position: absolute;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 1px 5px rgba(0,0,0,0.22);
    }

    .toggle-track.on .toggle-thumb { transform: translateX(22px); }

    /* ── Save button ── */
    .save-btn {
      width: 100%;
      padding: 16px;
      background: var(--text);
      color: white;
      border: none;
      border-radius: var(--r-sm);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.1px;
      transition: opacity 0.15s;
    }

    .save-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>Trénink</h1>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="sPlanned">0</div>
      <div class="stat-label">Plán</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="sDone">0</div>
      <div class="stat-label">Hotovo</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="sPct">—</div>
      <div class="stat-label">Splněno</div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="card">
    <div class="weekdays">
      <div class="wd">Po</div>
      <div class="wd">Út</div>
      <div class="wd">St</div>
      <div class="wd">Čt</div>
      <div class="wd">Pá</div>
      <div class="wd">So</div>
      <div class="wd">Ne</div>
    </div>
    <div class="cal-grid" id="grid"></div>

    <div class="legend">
      <div class="leg"><div class="leg-dot c-pilates"></div>Pilátes</div>
      <div class="leg"><div class="leg-dot c-silovy"></div>Silový</div>
      <div class="leg"><div class="leg-dot c-volejbal"></div>Volejbal</div>
      <div class="leg"><div class="leg-dot c-kolo"></div>Kolo</div>
      <div class="leg"><div class="leg-dot c-diastaza"></div>Diastáza</div>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div class="overlay" id="overlay" onclick="onOverlayClick(event)">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-date" id="sheetDate"></div>

      <div class="workout-grid">
        <div class="wo-btn c-pilates t-pilates"  data-w="pilates"  onclick="pick('pilates')">Pilátes</div>
        <div class="wo-btn c-silovy t-silovy"    data-w="silovy"   onclick="pick('silovy')">Silový trénink</div>
        <div class="wo-btn c-volejbal t-volejbal" data-w="volejbal" onclick="pick('volejbal')">Volejbal</div>
        <div class="wo-btn c-kolo t-kolo"        data-w="kolo"     onclick="pick('kolo')">Kolo</div>
        <div class="wo-btn c-diastaza t-diastaza" data-w="diastaza" onclick="pick('diastaza')">Diastáza</div>
        <div class="wo-btn wo-none"              data-w=""         onclick="pick('')">Žádný trénink</div>
      </div>

      <div class="done-row disabled" id="doneRow" onclick="toggleDone()">
        <span class="done-row-label">Označit jako splněno</span>
        <div class="toggle-track" id="toggleTrack">
          <div class="toggle-thumb"></div>
        </div>
      </div>

      <button class="save-btn" onclick="save()">Uložit</button>
    </div>
  </div>

  <script>
    const MONTHS = ['Leden','Únor','Březen','Duben','Květen','Červen',
                    'Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
    const MONTHS_GEN = ['ledna','února','března','dubna','května','června',
                        'července','srpna','září','října','listopadu','prosince'];

    let year = new Date().getFullYear();
    let month = new Date().getMonth();
    let db = JSON.parse(localStorage.getItem('wt') || '{}');

    // Modal state
    let selDate = null;
    let mWorkout = '';
    let mDone = false;

    function key(y, m, d) {
      return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }

    function changeMonth(d) {
      month += d;
      if (month > 11) { month = 0; year++; }
      if (month < 0)  { month = 11; year--; }
      render();
    }

    function render() {
      document.getElementById('monthLabel').textContent =
        `${MONTHS[month]} ${year}`;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const offset = (new Date(year, month, 1).getDay() + 6) % 7;
      const days   = new Date(year, month + 1, 0).getDate();
      const today  = new Date();

      for (let i = 0; i < offset; i++) {
        const e = document.createElement('div');
        e.className = 'day empty';
        grid.appendChild(e);
      }

      for (let d = 1; d <= days; d++) {
        const k = key(year, month, d);
        const entry = db[k];
        const isToday = today.getFullYear() === year &&
                        today.getMonth() === month &&
                        today.getDate() === d;

        const cell = document.createElement('div');
        cell.className = 'day' + (isToday ? ' today' : '');
        cell.onclick = () => openSheet(k, d);

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = d;
        cell.appendChild(num);

        if (entry?.workout) {
          const badge = document.createElement('div');
          badge.className = `day-badge c-${entry.workout}`;
          cell.appendChild(badge);

          if (entry.done) {
            const chk = document.createElement('div');
            chk.className = 'done-check';
            chk.textContent = '✓';
            cell.appendChild(chk);
          }
        }

        grid.appendChild(cell);
      }

      // Stats
      const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
      let planned = 0, done = 0;
      Object.entries(db).forEach(([k, v]) => {
        if (k.startsWith(prefix) && v?.workout) {
          planned++;
          if (v.done) done++;
        }
      });
      document.getElementById('sPlanned').textContent = planned;
      document.getElementById('sDone').textContent = done;
      document.getElementById('sPct').textContent =
        planned ? `${Math.round(done / planned * 100)}%` : '—';
    }

    function openSheet(k, d) {
      selDate = k;
      const entry = db[k] || {};
      mWorkout = entry.workout || '';
      mDone    = entry.done   || false;

      document.getElementById('sheetDate').textContent =
        `${d}. ${MONTHS_GEN[month]} ${year}`;

      document.querySelectorAll('.wo-btn').forEach(el => {
        el.classList.toggle('sel', el.dataset.w === mWorkout);
      });

      updateToggle();
      document.getElementById('overlay').classList.add('open');
    }

    function onOverlayClick(e) {
      if (e.target === document.getElementById('overlay'))
        document.getElementById('overlay').classList.remove('open');
    }

    function pick(w) {
      mWorkout = w;
      document.querySelectorAll('.wo-btn').forEach(el => {
        el.classList.toggle('sel', el.dataset.w === w);
      });
      if (!w) { mDone = false; }
      updateToggle();
    }

    function toggleDone() {
      mDone = !mDone;
      updateToggle();
    }

    function updateToggle() {
      const row = document.getElementById('doneRow');
      const track = document.getElementById('toggleTrack');
      row.classList.toggle('disabled', !mWorkout);
      track.classList.toggle('on', mDone && !!mWorkout);
    }

    function save() {
      if (mWorkout) {
        db[selDate] = { workout: mWorkout, done: mDone };
      } else {
        delete db[selDate];
      }
      localStorage.setItem('wt', JSON.stringify(db));
      document.getElementById('overlay').classList.remove('open');
      render();
    }

    render();
  </script>
</body>
</html>
